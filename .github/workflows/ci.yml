name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.1.3

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Enforce clean working tree after build
        run: git diff --exit-code

      - name: Run verification suite
        run: node scripts/verify.mjs

      - name: Run version lockstep check
        run: node scripts/check-version-lockstep.mjs

      - name: Run acceptance sweep
        run: node scripts/acceptance-sweep.mjs

      - name: Run packed install gate
        run: node scripts/gate/install-gate.mjs --full

  test-suite:
    name: Package Test Harness (Deferred)
    runs-on: ubuntu-latest
    # Note: Package test suite (node --test) explicitly deferred per plan/dev/index.md
    if: false
    steps:
      - name: Skipped placeholder
        run: echo "Package test suite deferred until test harness restoration"
